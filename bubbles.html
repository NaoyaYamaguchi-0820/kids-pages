<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>シャボンだま</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #bfe6ff;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  let width = 0;
  let height = 0;
  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- 音（Web Audio で生成するのでオフラインでも鳴る） ----
  let audio = null;
  function ensureAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio = new AC();
    }
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }

  // ドレミファソラシド
  const NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];

  function playPop(radius) {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime;
    // 大きいシャボン玉ほど低い音
    const t = Math.min(Math.max((radius - minRadius()) / (maxRadius() - minRadius()), 0), 1);
    const idx = Math.round((1 - t) * (NOTES.length - 1));
    const freq = NOTES[idx];

    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * 1.5, now);
    osc.frequency.exponentialRampToValueAtTime(freq, now + 0.08);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc.connect(gain).connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.4);

    // キラッとした倍音
    const osc2 = ac.createOscillator();
    const gain2 = ac.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);
    gain2.gain.setValueAtTime(0.0001, now);
    gain2.gain.exponentialRampToValueAtTime(0.12, now + 0.01);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc2.connect(gain2).connect(ac.destination);
    osc2.start(now);
    osc2.stop(now + 0.3);
  }

  // ---- シャボン玉 ----
  const HUES = [0, 30, 55, 120, 190, 220, 280, 320];

  function minRadius() { return Math.max(40, Math.min(width, height) * 0.08); }
  function maxRadius() { return Math.max(70, Math.min(width, height) * 0.16); }
  function maxBubbles() { return Math.max(6, Math.min(14, Math.round((width * height) / 60000))); }

  const bubbles = [];
  const particles = [];
  const rings = [];

  function createBubble(fromBottom) {
    const r = minRadius() + Math.random() * (maxRadius() - minRadius());
    return {
      x: r + Math.random() * Math.max(1, width - r * 2),
      y: fromBottom ? height + r + Math.random() * height * 0.3 : r + Math.random() * (height - r * 2),
      r,
      baseX: 0,
      speed: 25 + Math.random() * 35,
      wobbleAmp: 10 + Math.random() * 25,
      wobbleSpeed: 0.6 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      hue: HUES[Math.floor(Math.random() * HUES.length)],
      spawnScale: fromBottom ? 1 : 0,
    };
  }

  function addBubble(fromBottom) {
    const b = createBubble(fromBottom);
    b.baseX = b.x;
    bubbles.push(b);
  }

  for (let i = 0; i < maxBubbles(); i++) addBubble(false);

  function pop(b) {
    playPop(b.r);
    rings.push({ x: b.x, y: b.y, r: b.r, life: 1, hue: b.hue });
    const count = 14;
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const s = 120 + Math.random() * 180;
      particles.push({
        x: b.x + Math.cos(a) * b.r * 0.8,
        y: b.y + Math.sin(a) * b.r * 0.8,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        size: 4 + Math.random() * 6,
        hue: (b.hue + Math.random() * 60) % 360,
        life: 1,
        star: Math.random() < 0.5,
      });
    }
  }

  // ---- タッチ操作（マルチタッチ対応） ----
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    const x = e.clientX;
    const y = e.clientY;
    // 手前（後から描かれた）ものを優先。小さな指でも当たりやすいよう判定を広めに
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      const dx = x - b.x;
      const dy = y - b.y;
      const hit = b.r * 1.25;
      if (dx * dx + dy * dy <= hit * hit) {
        pop(b);
        bubbles.splice(i, 1);
        return;
      }
    }
  }, { passive: false });

  ['contextmenu', 'gesturestart', 'dblclick'].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });

  // ---- 描画 ----
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, height);
    g.addColorStop(0, '#a9dcff');
    g.addColorStop(0.6, '#d9f1ff');
    g.addColorStop(1, '#fff4d6');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height);
  }

  function drawBubble(b) {
    const r = b.r * easeOutBack(b.spawnScale);
    if (r <= 0) return;
    const { x, y, hue } = b;

    // 本体（うっすら虹色）
    const body = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    body.addColorStop(0, `hsla(${hue}, 100%, 97%, 0.25)`);
    body.addColorStop(0.7, `hsla(${hue}, 90%, 80%, 0.35)`);
    body.addColorStop(0.92, `hsla(${(hue + 60) % 360}, 90%, 70%, 0.65)`);
    body.addColorStop(1, `hsla(${(hue + 120) % 360}, 90%, 75%, 0.9)`);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // ふち
    ctx.lineWidth = Math.max(2, r * 0.04);
    ctx.strokeStyle = `hsla(${hue}, 80%, 65%, 0.7)`;
    ctx.stroke();

    // ハイライト
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.38, y - r * 0.4, r * 0.22, r * 0.12, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(x + r * 0.35, y + r * 0.4, r * 0.07, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStar(x, y, size) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const rr = i % 2 === 0 ? size : size * 0.45;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // ---- ループ ----
  let last = performance.now();
  let time = 0;
  let spawnTimer = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    // 補充
    spawnTimer -= dt;
    if (bubbles.length < maxBubbles() && spawnTimer <= 0) {
      addBubble(true);
      spawnTimer = 0.5 + Math.random() * 0.8;
    }

    // シャボン玉の移動
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (b.spawnScale < 1) b.spawnScale = Math.min(1, b.spawnScale + dt * 2);
      b.y -= b.speed * dt;
      b.x = b.baseX + Math.sin(time * b.wobbleSpeed + b.phase) * b.wobbleAmp;
      if (b.y < -b.r * 1.5) bubbles.splice(i, 1);
    }

    // 破裂エフェクト
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt * 1.4;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vx *= 0.96;
      p.vy = p.vy * 0.96 + 200 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt * 3;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }

    drawBackground();
    bubbles.forEach(drawBubble);

    rings.forEach((ring) => {
      ctx.strokeStyle = `hsla(${ring.hue}, 90%, 70%, ${ring.life})`;
      ctx.lineWidth = 4 * ring.life + 1;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r * (1 + (1 - ring.life) * 0.6), 0, Math.PI * 2);
      ctx.stroke();
    });

    particles.forEach((p) => {
      ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${Math.max(p.life, 0)})`;
      if (p.star) {
        drawStar(p.x, p.y, p.size * 1.4);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

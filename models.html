<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>くるくるずかん</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#c9ecff, #eef9ff 60%, #e3f5d6);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  button {
    border: none;
    padding: 0;
    cursor: pointer;
    color: #4a6fa5;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 5px 0 #9cc3e6;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #9cc3e6;
  }
  #sound {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    right: calc(16px + env(safe-area-inset-right));
    width: 72px;
    height: 72px;
    border-radius: 50%;
  }
  #sound svg {
    width: 44px;
    height: 44px;
  }
  #sound .on { display: none; }
  #sound.enabled .on { display: inline; }
  #sound.enabled .off { display: none; }
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 16px;
    pointer-events: none;
  }
  .bar > * {
    pointer-events: auto;
  }
  .arrow {
    flex: none;
    width: 76px;
    height: 76px;
    border-radius: 50%;
  }
  .arrow svg {
    width: 52px;
    height: 52px;
  }
  #name {
    flex: none;
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    color: #4a6fa5;
    font-size: 24px;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
  }
  @media (max-width: 360px) {
    .arrow { width: 64px; height: 64px; }
    .arrow svg { width: 44px; height: 44px; }
    #name { font-size: 22px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="sound" type="button" aria-label="おとをだす" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <g class="on"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g>
    <g class="off"><path d="M16 9l5 6"/><path d="M21 9l-5 6"/></g>
  </svg>
</button>
<div class="bar">
  <button id="prev" class="arrow" type="button" aria-label="まえ">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4.5 7 12l8.5 7.5z"/></svg>
  </button>
  <div id="name"></div>
  <button id="next" class="arrow" type="button" aria-label="つぎ">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4.5 17 12l-8.5 7.5z"/></svg>
  </button>
</div>
<script src="vendor/three/three.min.js"></script>
<script src="assets/kenney/models.js"></script>
<script>
(() => {
  // ---- 音（Web Audio で生成するのでオフラインでも鳴る） ----
  // 音はボタンで明示的にオンにしたときだけ鳴らす
  let audio = null;
  let soundOn = false;
  function ensureAudio() {
    if (!soundOn) return null;
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      // iPhone のマナーモードでも鳴るようにする（対応ブラウザのみ）
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      audio = new AC();
    }
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }

  function tone(type, from, to, duration, volume) {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, now);
    osc.frequency.exponentialRampToValueAtTime(to, now + duration * 0.6);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(now);
    osc.stop(now + duration + 0.05);
  }

  // 切り替えたとき：ポンッ
  function playSwitch() {
    tone('sine', 400, 700, 0.25, 0.3);
  }
  // タッチして跳ねたとき：ぴょーん
  function playJump() {
    tone('triangle', 500, 1000, 0.35, 0.25);
  }

  const soundButton = document.getElementById('sound');
  soundButton.addEventListener('click', () => {
    soundOn = !soundOn;
    soundButton.classList.toggle('enabled', soundOn);
    soundButton.setAttribute('aria-pressed', String(soundOn));
    soundButton.setAttribute('aria-label', soundOn ? 'おとをけす' : 'おとをだす');
    // オンにしたことが分かるように一音鳴らす
    if (soundOn) playSwitch();
  });

  // ---- 3D の準備 ----
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(4.5, 3.2, 6);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xbcd6a8, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(4, 8, 5);
  scene.add(sun);

  // 足元の丸いかげ
  const shadowTexture = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(60, 90, 60, 0.35)');
    g.addColorStop(1, 'rgba(60, 90, 60, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 4),
    new THREE.MeshBasicMaterial({ map: shadowTexture, transparent: true, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.001;
  scene.add(shadow);

  // スワイプで回す・ピンチで拡大縮小
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 3;
  controls.maxDistance = 12;
  controls.maxPolarAngle = Math.PI * 0.62;
  controls.rotateSpeed = 0.8;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.update();

  // 触っている間は自動回転を止め、しばらく触らなければまた回り出す
  let idleTimer = null;
  controls.addEventListener('start', () => {
    controls.autoRotate = false;
    clearTimeout(idleTimer);
  });
  controls.addEventListener('end', () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { controls.autoRotate = true; }, 4000);
  });

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // 縦長の画面でもモデルがはみ出さないように
    camera.fov = w < h ? 55 : 40;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- モデルを作る道具 ----
  const materials = new Map();
  function mat(color) {
    if (!materials.has(color)) {
      materials.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05 }));
    }
    return materials.get(color);
  }

  function part(group, geometry, color, x, y, z, opts = {}) {
    const m = new THREE.Mesh(geometry, mat(color));
    m.position.set(x, y, z);
    if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
    if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
    group.add(m);
    return m;
  }

  const sphere = (r) => new THREE.SphereGeometry(r, 32, 20);
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cylinder = (rt, rb, h, seg = 32) => new THREE.CylinderGeometry(rt, rb, h, seg);
  const cone = (r, h, seg = 32) => new THREE.ConeGeometry(r, h, seg);
  const torus = (r, t) => new THREE.TorusGeometry(r, t, 16, 40);

  // くりっとした目（黒目＋白いひかり）
  function eye(group, x, y, z, r, facing = 0) {
    part(group, sphere(r), 0x2b2b2b, x, y, z);
    const dx = Math.sin(facing) * r * 0.6;
    const dz = Math.cos(facing) * r * 0.6;
    part(group, sphere(r * 0.35), 0xffffff, x + dx - r * 0.25, y + r * 0.35, z + dz);
  }

  // ---- モデル ----
  const MODELS = [
    {
      name: 'くるま',
      build(g) {
        part(g, box(2.6, 0.7, 1.4), 0xff6b6b, 0, 0.75, 0);
        part(g, box(1.4, 0.65, 1.3), 0xff6b6b, -0.2, 1.4, 0);
        part(g, box(1.42, 0.45, 1.32), 0xbfe6ff, -0.2, 1.42, 0);
        part(g, box(0.2, 0.45, 1.34), 0xff6b6b, -0.2, 1.42, 0);
        [[-0.85, 0.72], [0.85, 0.72], [-0.85, -0.72], [0.85, -0.72]].forEach(([x, z]) => {
          part(g, cylinder(0.38, 0.38, 0.3), 0x333333, x, 0.38, z, { rot: [Math.PI / 2, 0, 0] });
          part(g, cylinder(0.18, 0.18, 0.32), 0xdddddd, x, 0.38, z, { rot: [Math.PI / 2, 0, 0] });
        });
        part(g, sphere(0.14), 0xfff3a0, 1.3, 0.85, 0.45);
        part(g, sphere(0.14), 0xfff3a0, 1.3, 0.85, -0.45);
        part(g, box(0.08, 0.15, 1.2), 0xdddddd, 1.32, 0.5, 0);
      },
    },
    {
      name: 'ロケット',
      build(root) {
        // 炎が地面にめり込まないよう全体を少し持ち上げる
        const g = new THREE.Group();
        g.position.y = 0.3;
        root.add(g);
        part(g, cylinder(0.55, 0.55, 1.8), 0xf1f3f5, 0, 1.3, 0);
        part(g, cone(0.55, 0.8), 0xff6b6b, 0, 2.6, 0);
        part(g, cylinder(0.5, 0.35, 0.3), 0x868e96, 0, 0.28, 0);
        part(g, torus(0.25, 0.06), 0x4dabf7, 0, 1.6, 0.55);
        part(g, cylinder(0.22, 0.22, 0.05), 0xbfe6ff, 0, 1.6, 0.54, { rot: [Math.PI / 2, 0, 0] });
        for (let i = 0; i < 3; i++) {
          const a = (Math.PI * 2 * i) / 3 + Math.PI / 6;
          const fin = part(g, box(0.08, 0.7, 0.55), 0xff6b6b, Math.sin(a) * 0.72, 0.65, Math.cos(a) * 0.72);
          fin.rotation.y = a;
        }
        part(g, cone(0.3, 0.5), 0xffa94d, 0, -0.05, 0, { rot: [Math.PI, 0, 0] });
        part(g, cone(0.16, 0.3), 0xffe066, 0, 0.0, 0, { rot: [Math.PI, 0, 0] });
      },
    },
    {
      name: 'おうち',
      build(g) {
        part(g, box(2, 1.4, 1.8), 0xfff3d6, 0, 0.7, 0);
        const roof = part(g, cone(1.65, 1.1, 4), 0x4dabf7, 0, 1.95, 0);
        roof.rotation.y = Math.PI / 4;
        part(g, box(0.25, 0.7, 0.25), 0xc0765a, 0.55, 2.2, -0.3);
        part(g, box(0.5, 0.8, 0.05), 0xc0765a, 0, 0.4, 0.91);
        part(g, sphere(0.05), 0xffd43b, 0.15, 0.4, 0.95);
        [[-0.6], [0.6]].forEach(([x]) => {
          part(g, box(0.45, 0.45, 0.05), 0xffffff, x, 0.95, 0.91);
          part(g, box(0.35, 0.35, 0.06), 0xbfe6ff, x, 0.95, 0.91);
        });
        part(g, box(0.05, 0.45, 0.45), 0xffffff, 1.01, 0.95, 0);
        part(g, box(0.06, 0.35, 0.35), 0xbfe6ff, 1.01, 0.95, 0);
      },
    },
    {
      name: 'ゆきだるま',
      build(g) {
        part(g, sphere(0.8), 0xffffff, 0, 0.75, 0);
        part(g, sphere(0.55), 0xffffff, 0, 1.8, 0);
        eye(g, -0.18, 1.92, 0.48, 0.07);
        eye(g, 0.18, 1.92, 0.48, 0.07);
        part(g, cone(0.08, 0.4), 0xff922b, 0, 1.8, 0.7, { rot: [Math.PI / 2, 0, 0] });
        part(g, torus(0.45, 0.1), 0xff6b6b, 0, 1.4, 0, { rot: [Math.PI / 2, 0, 0] });
        part(g, box(0.18, 0.5, 0.08), 0xff6b6b, 0.3, 1.2, 0.4, { rot: [0.3, 0, 0.2] });
        part(g, cylinder(0.35, 0.35, 0.45), 0x495057, 0, 2.45, 0);
        part(g, cylinder(0.55, 0.55, 0.05), 0x495057, 0, 2.23, 0);
        [0.5, 0.8].forEach((y) => part(g, sphere(0.07), 0x495057, 0, y, 0.78));
        part(g, cylinder(0.03, 0.03, 0.9, 8), 0x8b5a2b, -0.95, 1.2, 0, { rot: [0, 0, 1.0] });
        part(g, cylinder(0.03, 0.03, 0.9, 8), 0x8b5a2b, 0.95, 1.2, 0, { rot: [0, 0, -1.0] });
      },
    },
    {
      name: 'くまさん',
      build(g) {
        const brown = 0xc68b59;
        const light = 0xf1d3b3;
        part(g, sphere(0.7), brown, 0, 0.85, 0, { scale: [1, 1.05, 0.9] });
        part(g, sphere(0.42), light, 0, 0.8, 0.42, { scale: [1, 1.1, 0.6] });
        part(g, sphere(0.6), brown, 0, 1.95, 0);
        part(g, sphere(0.22), brown, -0.45, 2.42, 0);
        part(g, sphere(0.22), brown, 0.45, 2.42, 0);
        part(g, sphere(0.12), light, -0.45, 2.42, 0.1);
        part(g, sphere(0.12), light, 0.45, 2.42, 0.1);
        part(g, sphere(0.25), light, 0, 1.82, 0.48, { scale: [1.1, 0.85, 0.8] });
        part(g, sphere(0.08), 0x3b2a20, 0, 1.9, 0.68, { scale: [1.2, 0.9, 0.9] });
        eye(g, -0.2, 2.05, 0.52, 0.07);
        eye(g, 0.2, 2.05, 0.52, 0.07);
        part(g, sphere(0.1), 0xff9aa2, -0.35, 1.85, 0.45, { scale: [1, 0.6, 0.5] });
        part(g, sphere(0.1), 0xff9aa2, 0.35, 1.85, 0.45, { scale: [1, 0.6, 0.5] });
        part(g, sphere(0.22), brown, -0.68, 1.05, 0.15, { scale: [1, 1.4, 1] });
        part(g, sphere(0.22), brown, 0.68, 1.05, 0.15, { scale: [1, 1.4, 1] });
        part(g, sphere(0.26), brown, -0.35, 0.22, 0.3, { scale: [1, 0.8, 1.2] });
        part(g, sphere(0.26), brown, 0.35, 0.22, 0.3, { scale: [1, 0.8, 1.2] });
      },
    },
    {
      name: 'きのこ',
      build(g) {
        part(g, cylinder(0.35, 0.45, 1.1), 0xfff3d6, 0, 0.55, 0);
        const cap = new THREE.SphereGeometry(1.1, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2);
        part(g, cap, 0xff6b6b, 0, 1.05, 0, { scale: [1, 0.75, 1] });
        part(g, cylinder(1.1, 1.1, 0.04, 40), 0xffe8cc, 0, 1.05, 0);
        [[0, 0.9], [0.9, 0.45], [2.1, 0.55], [3.3, 0.5], [4.4, 0.6], [5.4, 0.45], [1.5, 1.2], [4.0, 1.25]]
          .forEach(([phi, theta]) => {
            const x = Math.sin(theta) * Math.cos(phi) * 1.08;
            const y = 1.05 + Math.cos(theta) * 0.75 * 1.08;
            const z = Math.sin(theta) * Math.sin(phi) * 1.08;
            part(g, sphere(0.16), 0xffffff, x, y, z, { scale: [1, 0.6, 1] });
          });
        eye(g, -0.15, 0.65, 0.4, 0.06);
        eye(g, 0.15, 0.65, 0.4, 0.06);
      },
    },
    {
      name: 'ひよこ',
      build(g) {
        const yellow = 0xffd43b;
        part(g, sphere(0.8), yellow, 0, 0.8, 0, { scale: [1, 0.95, 1.05] });
        part(g, sphere(0.55), yellow, 0, 1.75, 0.15);
        eye(g, -0.22, 1.85, 0.6, 0.08);
        eye(g, 0.22, 1.85, 0.6, 0.08);
        part(g, cone(0.12, 0.3, 16), 0xff922b, 0, 1.7, 0.78, { rot: [Math.PI / 2, 0, 0] });
        part(g, sphere(0.1), 0xff9aa2, -0.38, 1.66, 0.5, { scale: [1, 0.6, 0.5] });
        part(g, sphere(0.1), 0xff9aa2, 0.38, 1.66, 0.5, { scale: [1, 0.6, 0.5] });
        part(g, sphere(0.35), 0xfcc419, -0.78, 0.9, 0, { scale: [0.35, 0.8, 1] });
        part(g, sphere(0.35), 0xfcc419, 0.78, 0.9, 0, { scale: [0.35, 0.8, 1] });
        part(g, cone(0.1, 0.3, 12), yellow, 0, 2.35, 0.1);
        part(g, box(0.12, 0.08, 0.3), 0xff922b, -0.3, 0.04, 0.3);
        part(g, box(0.12, 0.08, 0.3), 0xff922b, 0.3, 0.04, 0.3);
      },
    },
    {
      name: 'き',
      build(g) {
        part(g, cylinder(0.22, 0.3, 1.0, 16), 0x8b5a2b, 0, 0.5, 0);
        part(g, sphere(0.8), 0x51cf66, 0, 1.55, 0);
        part(g, sphere(0.6), 0x69db7c, -0.55, 1.3, 0.2);
        part(g, sphere(0.6), 0x40c057, 0.55, 1.35, -0.1);
        part(g, sphere(0.55), 0x69db7c, 0.1, 2.15, 0.1);
        [[-0.3, 1.8, 0.62], [0.45, 1.5, 0.55], [-0.6, 1.25, 0.72], [0.2, 2.2, 0.55], [0.8, 1.7, 0.3]]
          .forEach(([x, y, z]) => part(g, sphere(0.12), 0xff6b6b, x, y, z));
      },
    },
    // ここから下は Kenney (www.kenney.nl) の3Dモデル（CC0）
    { name: 'トラック', kenney: 'truck', size: 3.0 },
    { name: 'バイク', kenney: 'motorcycle', size: 2.8 },
    { name: 'おともだち', kenney: 'character', size: 2.4 },
    { name: 'コイン', kenney: 'coin', size: 1.8 },
    { name: 'たてもの', kenney: 'building', size: 2.4 },
    { name: 'ふんすい', kenney: 'fountain', size: 2.6 },
    { name: 'トロフィー', kenney: 'trophy', size: 2.4 },
  ];

  // ---- Kenney のモデルを読み込む ----
  // assets/kenney/models.js に埋め込んだデータから読むので、オフラインでもファイルを直接開いても動く
  const gltfLoader = new THREE.GLTFLoader();
  const kenneyCache = new Map();
  function loadKenney(id) {
    if (!kenneyCache.has(id)) {
      const binary = atob(window.KENNEY_MODELS[id]);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      kenneyCache.set(id, new Promise((resolve, reject) => {
        gltfLoader.parse(bytes.buffer, '', resolve, reject);
      }));
    }
    return kenneyCache.get(id);
  }

  // 大きさをそろえて、足元を地面(y=0)に、中心を真ん中に置く
  function addKenney(group, model) {
    group.userData.shared = true;
    loadKenney(model.kenney).then((gltf) => {
      const object = gltf.scene.clone(true);
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = model.size / Math.max(size.x, size.y, size.z);
      object.scale.setScalar(scale);
      object.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
      group.add(object);

      // 「ふだんの動き」のアニメーションがあれば流す
      const idle = gltf.animations.find((clip) => clip.name === 'idle');
      if (idle) {
        group.userData.mixer = new THREE.AnimationMixer(object);
        group.userData.mixer.clipAction(idle).play();
      }
    });
  }

  // ---- 切り替えとアニメーション ----
  const nameLabel = document.getElementById('name');
  let index = 0;
  let current = null;   // { group, born, jumpStart }
  let leaving = null;   // { group, start }

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function disposeGroup(group) {
    // Kenney のモデルは形のデータを使い回すので破棄しない
    if (!group.userData.shared) {
      group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    }
    scene.remove(group);
  }

  function show(i, withSound) {
    index = (i + MODELS.length) % MODELS.length;
    if (current) {
      if (leaving) disposeGroup(leaving.group);
      leaving = { group: current.group, start: performance.now() };
    }
    const group = new THREE.Group();
    const model = MODELS[index];
    if (model.kenney) addKenney(group, model);
    else model.build(group);
    group.scale.setScalar(0.001);
    scene.add(group);
    current = { group, born: performance.now(), jumpStart: -Infinity };
    nameLabel.textContent = MODELS[index].name;
    if (withSound) playSwitch();
  }

  document.getElementById('prev').addEventListener('click', () => show(index - 1, true));
  document.getElementById('next').addEventListener('click', () => show(index + 1, true));

  // モデルをタッチ（ドラッグではなく軽くタップ）したら、ぴょんと跳ねる
  const raycaster = new THREE.Raycaster();
  let downInfo = null;
  canvas.addEventListener('pointerdown', (e) => {
    downInfo = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
  });
  canvas.addEventListener('pointerup', (e) => {
    if (!downInfo || downInfo.id !== e.pointerId) return;
    const moved = Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y);
    const quick = performance.now() - downInfo.t < 500;
    downInfo = null;
    if (moved > 12 || !quick || !current) return;
    const pointer = new THREE.Vector2(
      (e.clientX / window.innerWidth) * 2 - 1,
      -(e.clientY / window.innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.intersectObject(current.group, true).length > 0) {
      const now = performance.now();
      if (now - current.jumpStart > 400) {
        current.jumpStart = now;
        playJump();
      }
    }
  });

  ['contextmenu', 'gesturestart', 'dblclick'].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });

  let lastFrame = performance.now();
  function animate(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    if (current) {
      const g = current.group;
      if (g.userData.mixer) g.userData.mixer.update(dt);
      const grow = Math.min((now - current.born) / 500, 1);
      let s = Math.max(easeOutBack(grow), 0.001);

      // ジャンプ：上に跳ねて、着地でむにっとつぶれる
      const jt = (now - current.jumpStart) / 700;
      let y = 0;
      let squash = 1;
      if (jt >= 0 && jt < 1) {
        if (jt < 0.8) {
          y = Math.sin((jt / 0.8) * Math.PI) * 1.0;
        } else {
          squash = 1 - Math.sin(((jt - 0.8) / 0.2) * Math.PI) * 0.15;
        }
      }
      g.position.y = y;
      g.scale.set(s * (2 - squash), s * squash, s * (2 - squash));
      shadow.scale.setScalar(Math.max(0.3, 1 - y * 0.4) * s);
    }

    if (leaving) {
      const t = (now - leaving.start) / 200;
      if (t >= 1) {
        disposeGroup(leaving.group);
        leaving = null;
      } else {
        leaving.group.scale.setScalar(Math.max(1 - t, 0.001));
      }
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  // 切り替えたときにすぐ出せるよう、先に読み込んでおく
  MODELS.forEach((model) => { if (model.kenney) loadKenney(model.kenney); });

  show(0, false);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>こどもゲーム</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(#a9dcff, #fff4d6);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: 36px;
    color: #4a6fa5;
  }
  .games {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
  }
  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 200px;
    height: 200px;
    border-radius: 40px;
    background: #ffffff;
    box-shadow: 0 8px 0 #9cc3e6;
    text-decoration: none;
    color: #4a6fa5;
    font-size: 26px;
    font-weight: bold;
  }
  .game:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #9cc3e6;
  }
  .bubble {
    position: relative;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9) 0 10%, rgba(200,235,255,0.5) 40%, rgba(190,150,255,0.7) 90%, rgba(255,170,220,0.9) 100%);
    border: 3px solid rgba(160,140,255,0.6);
    box-sizing: border-box;
  }
  .ball {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0 8%, #ff6b6b 30%, #d94848 100%);
    position: relative;
    overflow: hidden;
  }
  .ball::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 41%;
    height: 18%;
    background: rgba(255, 255, 255, 0.75);
  }
</style>
</head>
<body>
  <h1>あそぼう！</h1>
  <div class="games">
    <a class="game" href="bubbles.html">
      <span class="bubble"></span>
      <span>シャボンだま</span>
    </a>
    <a class="game" href="balls.html">
      <span class="ball"></span>
      <span>ボールころころ</span>
    </a>
  </div>
</body>
</html>
